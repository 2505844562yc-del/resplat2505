# @package _global_

defaults:
  - override /dataset: dl3dv
  - override /model/encoder: resplat
  - override /loss: [mse, lpips]
  - override /dataset/view_sampler: boundedv2_360

wandb:
  name: v4_situation_a_residual_injection_dl3dv
  tags: [dl3dv, semantic-gaussians, semantic-depth-init, situation-a, residual-injection]

data_loader:
  train:
    batch_size: 1

trainer:
  max_steps: 300_001
  num_nodes: 1

model:
  encoder:
    num_depth_candidates: 128
    shim_patch_size: 16
    upsample_factor: 8
    lowest_feature_resolution: 8
    num_refine: 1
    train_min_refine: 1
    train_max_refine: 1

    # Strict screenshot Situation A:
    # F_depth' = F_c + gamma * A(F_s), gamma(0) = 0.
    use_semantic_gaussian_init: false
    use_semantic_depth_logit_adapter: false
    use_semantic_depth_feature_adapter: false
    use_semantic_depth_residual_injection: true
    semantic_depth_residual_hidden_channels: 64
    semantic_depth_residual_max_relative_gain: 0.1

    # Stage A1 freezes the complete pretrained ReSplat depth path.  Set this
    # true only in the later A2 fine-tuning stage after the residual is stable.
    semantic_depth_train_only: true
    semantic_depth_unfreeze_last_layers: false

    # Direct supervision of the initial Gaussians produced by conditioned depth.
    semantic_depth_kl_weight: 0.0
    semantic_depth_delta_weight: 0.01
    semantic_depth_init_rgb_loss_weight: 0.25
    semantic_depth_init_feature_loss_weight: 0.2
    semantic_depth_boundary_weight: 4.0

    # The same 16-D field serves as F_s and as each Gaussian's semantic z.
    use_semantic_gaussian_features: true
    semantic_feature_dim: 16
    semantic_feature_projection_trainable: true
    semantic_feature_loss_weight: 0.1

    # Keep later recurrent/splitting innovations out of the Situation A ablation.
    use_semantic_state_refinement: false
    use_semantic_residual_feedback: false
    use_semantic_uncertainty_refinement: false
    use_semantic_support_refinement: false
    use_semantic_ray_depth_head: false
    use_semantic_updater_adapter: false
    use_semantic_fixed_candidate_split: false
    semantic_joint_train_new_heads: false

loss:
  lpips:
    apply_after_step: 0
    weight: 0.5
    perceptual_loss: true

dataset:
  opencv_pose_format: true
  near: 0.01
  far: 200.0
  baseline_scale_bounds: false
  make_baseline_1: false
  min_views: 0
  max_views: 0
  highres: false
  mix_re10k: false
  pose_align_middle_view: true
  load_remain_context: false
  random_crop: false
  load_boundaries: true
  boundary_roots: [datasets/dl3dv_boundaries_sam2_small]
  boundary_missing_policy: error
  min_size: [384, 512]
  max_size: [512, 960]

train:
  depth_smooth_loss_weight: 0.0

test:
  eval_time_skip_steps: 0
  compute_scores: true
  dec_chunk_size: 30
