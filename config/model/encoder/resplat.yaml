# Core settings
name: resplat
num_depth_candidates: 128

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 1.
  sh_degree: 3
  exp_scale: false
  softplus_scale: true
  clamp_min_scale: 1e-6
  scale_detach_depth: false
  exp_scale_bias: 4.
  no_rotate_sh: true
  no_sh_mask: true
  init_rotation_identity: false

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

# UniMatch / cost volume
unimatch_weights_path: "pretrained/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
downscale_factor: 4
shim_patch_size: 4

# Multi-view stereo
num_scales: 1
upsample_factor: 4
lowest_feature_resolution: 4
depth_unet_channels: 128
grid_sample_disable_cudnn: false
local_mv_match: 2

# Color branch
gaussian_regressor_channels: 512

# Depth supervision and output
supervise_intermediate_depth: true
return_depth: true
sample_log_depth: true
bilinear_upsample_depth: false
no_upsample_depth: false

# Monodepth backbone
monodepth_vit_type: vitb

# Point Transformer (init)
attn_proj_channels: 64
knn_samples: 16
num_blocks: 6
init_use_local_knn: false
init_local_knn_spatial_radius: 3
init_local_knn_num_neighbor_views: 32
init_local_knn_cross_view_radius: 3

# Latent Gaussians
latent_downsample: 4
fixed_latent_size: true

# Multiple Gaussians per point
init_gaussian_multiple: 1
refine_same_num_points: false

# Handle high resolution images
depth_pred_half_res: false
no_crop_image: false

# Iterative refinement
num_refine: 0
train_min_refine: 0
train_max_refine: 0
num_basic_refine_blocks: 4

# Refinement state
state_channels: 512

# Refinement update module
update_attn_proj_channels: 64
refine_knn_samples: 8
refine_use_local_knn: false
refine_local_knn_spatial_radius: 3
refine_local_knn_num_neighbor_views: 32
refine_local_knn_cross_view_radius: 3

# Render error multi-view attention
render_error_mv_attn_blocks: 1
use_semantic_boundary_feedback: false
semantic_boundary_gain: 5.0
semantic_boundary_confidence_floor: 0.5
semantic_boundary_feedback_scale: 1.0
semantic_boundary_feature_mode: residual
semantic_boundary_alignment_radius: 4
semantic_boundary_alignment_sigma: 2.0
use_multiview_boundary_consensus: false
multiview_boundary_radius: 2
multiview_boundary_depth_relative_tolerance: 0.05
multiview_boundary_min_support_views: 2.0
multiview_boundary_blend: 1.0
semantic_structure_hidden_channels: 64
semantic_structure_gate_bias: -2.0
semantic_structure_warmup_steps: 5
semantic_structure_ramp_steps: 10
multiview_boundary_displacement_radius: 4
multiview_boundary_displacement_source_radius: 4
multiview_boundary_displacement_diagnostic_path: null
use_semantic_parameter_routing: false
semantic_parameter_route_hidden_channels: 64
semantic_parameter_route_gain: 0.5
semantic_parameter_route_appearance: true
use_semantic_selective_refinement: false
semantic_selective_hidden_channels: 64
semantic_selective_gate_bias: -2.0
semantic_selective_gain: 0.5
semantic_selective_radius: 2
use_semantic_gaussian_init: false
semantic_init_hidden_channels: 32
semantic_init_gate_bias: 0.0
semantic_init_proximity_radius: 4
semantic_init_depth_gain: 0.1
semantic_init_scale_gain: 0.5
semantic_init_auxiliary_loss_weight: 0.25
# Legacy late-logit and post-U-Net feature adapters are retained only for old
# ablations; neither one is called Situation A anymore.
use_semantic_depth_logit_adapter: false
use_semantic_depth_feature_adapter: false
# Screenshot Situation A: F_depth' = F_c + gamma * A(F_s), inserted after the
# pretrained depth U-Net and immediately before its original depth head.
use_semantic_depth_residual_injection: false
semantic_depth_hidden_channels: 64
semantic_depth_max_logit_residual: 0.25
semantic_depth_confidence_floor: 0.05
semantic_depth_gate_bias: -2.0
semantic_depth_kl_weight: 0.01
semantic_depth_delta_weight: 0.01
semantic_depth_init_rgb_loss_weight: 0.25
semantic_depth_init_feature_loss_weight: 0.1
semantic_depth_boundary_weight: 0.0
semantic_depth_feature_hidden_channels: 64
semantic_depth_max_feature_residual: 0.1
semantic_depth_feature_confidence_floor: 0.05
semantic_depth_feature_gate_bias: -2.0
semantic_depth_residual_hidden_channels: 64
semantic_depth_residual_max_relative_gain: 0.1
semantic_depth_unfreeze_last_layers: false
semantic_depth_train_only: false
use_semantic_gaussian_features: false
semantic_feature_dim: 16
semantic_feature_teacher_layer: -1
semantic_feature_projection_seed: 3407
semantic_feature_projection_trainable: false
use_semantic_state_refinement: false
semantic_state_residual_gain: 0.1
semantic_feature_loss_weight: 0.1
use_semantic_residual_feedback: false
semantic_residual_alpha_floor: 0.1
semantic_residual_alignment: source_grid
semantic_vjp_direct_gain: 0.0
use_semantic_uncertainty_refinement: false
semantic_uncertainty_hidden_channels: 128
semantic_uncertainty_residual_gain: 0.25
semantic_uncertainty_need_floor: 0.25
semantic_uncertainty_reliability_floor: 0.05
semantic_uncertainty_support_relative_scale: 4.0
semantic_uncertainty_loss_weight: 0.0
use_semantic_support_refinement: false
semantic_support_hidden_channels: 256
semantic_support_opacity_gain: 0.1
semantic_support_scale_gain: 0.05
semantic_support_regularization_weight: 0.01
use_semantic_geometry_vjp: false
semantic_geometry_mean_gain: 0.0
semantic_geometry_scale_gain: 0.0
semantic_geometry_confidence_floor: 0.0
semantic_geometry_mean_mode: full_3d
use_semantic_ray_depth_head: false
semantic_ray_depth_hidden_channels: 256
semantic_ray_depth_gain: 0.1
semantic_ray_depth_confidence_floor: 0.0
semantic_ray_depth_regularization_weight: 0.01
use_semantic_updater_adapter: false
semantic_updater_adapter_hidden_channels: 256
semantic_updater_adapter_gain: 0.1
semantic_updater_adapter_regularization_weight: 0.01
semantic_updater_adapter_train_only: false
semantic_updater_unfreeze_last_block: false
use_semantic_fixed_candidate_split: false
semantic_split_hidden_channels: 256
semantic_split_candidate_ratio: 0.25
semantic_split_opacity_fraction: 0.1
semantic_split_depth_gain: 0.1
semantic_split_scale_gain: 0.05
semantic_split_regularization_weight: 0.01
semantic_split_train_only: false
semantic_joint_train_new_heads: false

# AMP
use_amp: true
pt_head_amp: true
pt_update_amp: true

# Checkpointing
use_checkpointing: false
init_use_checkpointing: false
recurrent_use_checkpointing: false
